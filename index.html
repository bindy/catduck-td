<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>猫鸭塔防 · 守卫小鱼干</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <div id="hud">
      <div class="hud-item">第 <b id="hud-wave">1</b> 波</div>
      <div class="hud-item">🐟 鱼干 <b id="hud-gold">220</b></div>
      <div class="hud-item">🐠 小鱼 <b id="hud-fish">20</b></div>
      <div class="hud-item">最佳 <b id="hud-best">0</b> 波</div>
    </div>

    <div id="stage">
      <canvas id="game" width="720" height="840"></canvas>
      <div id="overlay-start" class="overlay">
        <h1>猫鸭塔防</h1>
        <p class="sub">守卫小鱼干！</p>
        <p class="desc">老鼠们想偷走猫的小鱼。点空地造猫塔，<br>升级它们，别让老鼠走到终点。</p>
        <p class="desc">鸭子是指挥官：开「自动指挥」，它会帮你造塔；<br>点「鸭子冲锋」，它会沿路撞飞老鼠。</p>
        <button id="btn-start" class="big-btn">开始游戏</button>
      </div>
      <div id="overlay-over" class="overlay hidden">
        <h1>小鱼被偷光了…</h1>
        <p class="desc">你守到了第 <b id="over-wave">1</b> 波</p>
        <p class="desc">最佳纪录：第 <b id="over-best">1</b> 波</p>
        <button id="btn-restart" class="big-btn">再来一局</button>
      </div>
    </div>

    <div id="panel">
      <div id="panel-hint">点一块空地，造一只猫塔</div>
      <div id="panel-build" class="hidden"></div>
      <div id="panel-tower" class="hidden"></div>
    </div>

    <div id="controls">
      <button id="btn-wave" class="ctl-btn primary">开始第 1 波</button>
      <button id="btn-pause" class="ctl-btn">暂停</button>
      <button id="btn-speed" class="ctl-btn">速度 1x</button>
      <button id="btn-auto" class="ctl-btn">自动指挥：关</button>
      <button id="btn-duck" class="ctl-btn">🦆 鸭子冲锋</button>
      <button id="btn-sound" class="ctl-btn">🔊 音效</button>
    </div>
  </div>
  <script src="./three.js"></script>
  <script src="./game3d-v5.js"></script>
</body>
</html>
